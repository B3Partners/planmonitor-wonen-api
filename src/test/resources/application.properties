planmonitor-wonen-api.version=@project.version@
planmonitor-wonen-api.apiVersion=@info.version@

planmonitor-wonen-api.base-path=/api/planmonitor-wonen

management.endpoints.access.default=none
management.endpoints.web.base-path=/api/planmonitor-wonen/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read_only
management.endpoint.info.access=read_only

spring.profiles.active=test
spring.profiles.default=test
#spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off

# we don't need JMX
spring.jmx.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.flyway.enabled=false

logging.level.nl.b3p.planmonitorwonen.api=TRACE
