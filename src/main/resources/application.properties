planmonitor-wonen-api.version=@project.version@
# base path for the API
planmonitor-wonen-api.base-path=/api/planmonitor-wonen

planmonitor-wonen-api.wfs.bestuurlijke-gebieden=https://service.pdok.nl/kadaster/bestuurlijkegebieden/wfs/v1_0
planmonitor-wonen-api.wfs.bestuurlijke-gebieden.provincies-typename=bestuurlijkegebieden:Provinciegebied
planmonitor-wonen-api.wfs.bestuurlijke-gebieden.provincies-propertyname=naam
planmonitor-wonen-api.wfs.bestuurlijke-gebieden.gemeentes-typename=bestuurlijkegebieden:Gemeentegebied

planmonitor-wonen-api.wfs.ruimte=https://opengeodata.zeeland.nl/geoserver/ruimte/wfs
planmonitor-wonen-api.wfs.ruimte.regios-typename=ruimte:georok_plnmntwnnregvlk
planmonitor-wonen-api.wfs.ruimte.regios-propertyname=regios
planmonitor-wonen-api.wfs.ruimte.woonmilieu-typename=ruimte:georok_plnmntwnnwonmiltopvlk
planmonitor-wonen-api.wfs.ruimte.woonmilieu-propertyname=woonmilieutypologie

planmonitor-wonen-api.populate-testdata=true

# OpenAPI documentation and Swagger UI, disable in production by setting environment variable
# PLANMONITOR_WONEN_API_OPENAPI_ENABLED=false
planmonitor-wonen-api.openapi.enabled=true
springdoc.api-docs.enabled=${planmonitor-wonen-api.openapi.enabled}
springdoc.swagger-ui.enabled=${planmonitor-wonen-api.openapi.enabled}
springdoc.api-docs.path=${planmonitor-wonen-api.base-path}/api-docs
springdoc.swagger-ui.path=${planmonitor-wonen-api.base-path}/swagger-ui.html
springdoc.paths-to-match=${planmonitor-wonen-api.base-path}/**
springdoc.default-produces-media-type=application/json
# springdoc hardcodes the swagger-ui webjar version it was built with; use the overridden version from the pom
springdoc.swagger-ui.version=@swagger-ui.version@

# in the tailormap-viewer Docker Compose stack this is changed to 0.0.0.0
server.address=localhost
server.port=8081
server.http2.enabled=true
server.compression.enabled=true
server.forward-headers-strategy=native

# Error responses as RFC 9457 problem details (application/problem+json)
spring.mvc.problemdetails.enabled=true

spring.main.banner-mode=off
spring.application.name=@project.artifactId@

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
tailormap.datasource.url=jdbc:postgresql:tailormap
tailormap.datasource.username=tailormap
tailormap.datasource.password=tailormap

spring.datasource.url=jdbc:postgresql:planmonitor-wonen
spring.datasource.username=planmonitor-wonen
spring.datasource.password=planmonitor-wonen

# Actuator: health is public (status only), info requires the admin or actuator group, see ApiSecurityConfig
management.endpoints.access.default=none
management.endpoints.web.base-path=/api/planmonitor-wonen/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read_only
management.endpoint.info.access=read_only
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.hostname=${HOST:localhost}

# The Docker image also logs to a file (LOGGING_FILE_NAME is set in the image). Rotated monthly instead of daily and
# not compressed, so looking back at the deliveries by gemeentes (twice a year) needs only a few files and plain grep.
# Kept for a year. The size limit per file normally keeps a month in one file
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM}.%i.log
logging.logback.rollingpolicy.max-history=12
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.total-size-cap=1GB

logging.level.org.springframework.boot=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.test.context=INFO
logging.level.org.springframework.security.web.authentication=DEBUG

# Hide logging all factory implementations
logging.level.org.geotools.util.factory=WARN

logging.group.planmonitorwonen=nl.b3p.planmonitorwonen.api
logging.group.auth=org.tailormap.api.security,nl.b3p.planmonitorwonen.api.configuration.JdbcSessionConfiguration
logging.group.geotools=org.geotools

